# ============================================================================
# DB FIREWALL — Universal AI Agent Tenant Isolation
# ============================================================================
# The middleware auto-detects your database engine and applies row-level
# security accordingly. It reads this file only from an explicit path:
#
#   export DB_FIREWALL_CONFIG=/path/to/.db-firewall.yaml
#
# or load_config(project_root="/path/to/app"). Only the path you name is
# checked: never the current folder or the home folder.
# ============================================================================

version: "1.0"

# ----------------------------------------------------------------------------
# TENANT COLUMN — The column name used across all protected tables.
# If a table has this column, the middleware protects it. Pass the same name
# to the migrations (run_migration() does it for PostgreSQL, MySQL and SQL Server;
# see README "Run the migration" for psql, mysql, sqlcmd and Oracle).
# Env override: DB_FIREWALL_TENANT_COLUMN
# ----------------------------------------------------------------------------
tenant_column: "tenant_id"

# ----------------------------------------------------------------------------
# FAIL MODE — What happens when no tenant context is set?
#   "closed" → the middleware refuses queries on protected tables
#              (PermissionError); the RLS layer returns 0 rows (RECOMMENDED)
#   "open"   → queries run unscoped by the middleware (development/testing only)
# Env override: DB_FIREWALL_FAIL_MODE
# ----------------------------------------------------------------------------
fail_mode: "closed"

# ----------------------------------------------------------------------------
# REWRITER — How the middleware injects the tenant predicate.
#   "ast"   → sqlglot parse + rewrite (DEFAULT). Scopes every table reference:
#             CTEs, UNION branches, joins, subqueries, UPDATE..FROM,
#             DELETE..USING, INSERT..SELECT/VALUES (stamps the tenant column).
#             Requires `pip install sqlglot`; raises ImportError if missing.
#   "regex" → DEPRECATED legacy single-WHERE injector, no dependency.
#             Runs only on PostgreSQL, SQL Server and Oracle; refused elsewhere. Refuses CTE/UNION/
#             multi-table shapes outright (fail closed) instead of scoping them.
# Env override: DB_FIREWALL_REWRITER=regex
# ----------------------------------------------------------------------------
rewriter: "ast"

# ----------------------------------------------------------------------------
# TENANT PLACEHOLDER — INSERT ... (tenant_id) VALUES (%s) binds the tenant
# column to a driver parameter the firewall cannot see. Refused by default;
# set true only when the database layer (RLS WITH CHECK) verifies it.
# ----------------------------------------------------------------------------
allow_tenant_placeholder: false

# ----------------------------------------------------------------------------
# TENANT HEADER — Django / FastAPI / Flask integrations ignore the X-Tenant-ID
# request header unless this is true. Any client can send it, so enable it
# only behind a gateway that authenticates the caller and overwrites any
# client-sent X-Tenant-ID.
# ?tenant_id= in the URL is never trusted.
# ----------------------------------------------------------------------------
trust_tenant_header: false

# ----------------------------------------------------------------------------
# PROTECTED OPERATIONS — Which SQL operations are filtered?
# ----------------------------------------------------------------------------
protect:
  select: true
  insert: true    # Prevents inserting rows for other tenants
  update: true    # Prevents updating rows across tenants
  delete: true    # Prevents deleting rows across tenants

# ----------------------------------------------------------------------------
# AUDIT — the middleware writes one row per DB-side tenant assignment.
# Needs the migration's audit table (PostgreSQL, MySQL, SQL Server:
# _firewall_audit_log). The row is part of the caller's transaction: a rollback
# drops it. A failed audit write fails closed like the context itself. With
# fail_mode: open on PostgreSQL the failed insert still aborts the transaction.
# Oracle: the migration's set_tenant always writes VPD_AUDIT_LOG itself.
# Purge: purge_audit(conn) deletes rows older than retention_days (you commit).
# log_queries: log every executed statement (after rewriting) to the
# "db_firewall.audit" logger at INFO. Careful: SQL can hold personal data.
# ----------------------------------------------------------------------------
audit:
  enabled: false
  table_name: "_firewall_audit_log"
  retention_days: 90
  log_queries: false

# ----------------------------------------------------------------------------
# TENANT RESOLUTION — protect(conn) without tenant_id= uses the request's
# tenant first (web integrations, tenant_scope(), set_tenant()); that cannot be
# moved. Then these sources, in order. A source with no value is skipped; a
# value that is set but invalid (e.g. TENANT_ID="bad\id") raises, it does not
# fall through to the next source:
#   env_var          an environment variable (variable:, default TENANT_ID)
#   db_user_map      the active map row for the current DB user (table:;
#                    Oracle default TENANT_USER_MAP). PostgreSQL, MySQL
#                    (user part of CURRENT_USER(), without @host),
#                    SQL Server, Oracle.
#   session_var      a tenant already set DB-side on this connection
#                    (PostgreSQL: variable:, default app.current_tenant).
#                    It takes whatever tenant is already on the connection,
#                    including one left by an earlier user of a pooled
#                    connection. Enable it only if every return to the pool
#                    runs release() or pool_checkin().
#   connection_param an attribute of the connection object, or param=value in
#                    its DSN (param_name:, default tenant_id)
# Nothing found: no tenant, so fail_mode decides.
# ----------------------------------------------------------------------------
resolution:
  - source: "env_var"
    variable: "TENANT_ID"
    enabled: true
  - source: "db_user_map"
    table: "_firewall_tenant_map"
    enabled: true
  - source: "session_var"
    variable: "app.current_tenant"
    enabled: false
  - source: "connection_param"
    param_name: "tenant_id"
    enabled: false

# ----------------------------------------------------------------------------
# EXCLUDED USERS — DB users whose connections the middleware does NOT scope
# (no rewrite, no fail-closed check, no DB-side context). Exact match on the
# name the database reports (Oracle: upper case). A failed lookup counts as
# not excluded. The database layer still applies unless the role is also in
# _firewall_bypass_roles. EMPTY BY DEFAULT: on managed Postgres (Supabase,
# Neon, RDS) the app often connects as "postgres", so a built-in list would
# disable the firewall for the app itself. Add roles deliberately, e.g. "_migrator".
# ----------------------------------------------------------------------------
excluded_users: []

# ----------------------------------------------------------------------------
# EXCLUDED TABLES — Tables that should NOT have tenant filtering.
# System/config tables that are shared across tenants.
# ----------------------------------------------------------------------------
excluded_tables:
  - "_firewall_*"     # Firewall's own tables (glob pattern)
  - "schema_migrations"
  - "alembic_version"
  - "knex_migrations"
  - "prisma_migrations"
  - "__diesel_schema_migrations"
  - "flyway_schema_history"
  - "app_config"
  - "feature_flags"

# ----------------------------------------------------------------------------
# PER-ENGINE OPTIONS
#   use_rls / use_views / use_vpd: false = do not set the DB-side tenant
#     context (middleware-only, e.g. before the migration is installed)
#   schema: what the scanner checks (PostgreSQL: also where run_migration
#     applies RLS). MySQL null = the current database; Oracle null = the user.
#     SQL Server: not used, the scanner checks all schemas.
#   policy_mode (PostgreSQL): "permissive" (default) or "restrictive".
#     restrictive = the tenant policies AND with the app's own RLS policies
#     (Supabase, Drizzle pgPolicy); see README "Run the migration".
#   audit_table: overrides audit.table_name for that engine
# ----------------------------------------------------------------------------
engines:
  postgresql:
    use_rls: true
    schema: "public"
    policy_mode: "permissive"
    # signed (default): the tenant is signed per transaction with
    # DB_FIREWALL_TENANT_KEY, so SQL the app runs cannot switch tenants.
    # plain: app.current_tenant alone, which any SQL in the transaction can set.
    tenant_context: "signed"
    # true: revoke pg_terminate_backend / pg_cancel_backend from PUBLIC in this
    # database, so tenants sharing the app role cannot end each other's
    # requests. Affects every app and role in the database; needs a superuser.
    harden_signals: false
    # true: also revoke CREATE on the database and every schema, TRIGGER and
    # TRUNCATE on every table (default privileges too), and pg_stat_activity,
    # from PUBLIC and app_role, by any grantor (what `db-firewall verify` fails
    # on). Refuses if app_role owns the database, a schema or a table.
    # Database-wide; needs a superuser.
    harden: false
    app_role: null
  mysql:
    use_views: true
    schema: null
  sqlserver:
    use_rls: true
    schema: "dbo"
  oracle:
    use_vpd: true
    schema: "APP_USER"
