# ============================================================================
# DB FIREWALL — Universal AI Agent Tenant Isolation
# ============================================================================
# The middleware auto-detects your database engine and applies row-level
# security accordingly. It reads this file only from an explicit path:
#
#   export DB_FIREWALL_CONFIG=/path/to/.db-firewall.yaml
#
# or load_config(project_root="/path/to/app"). Only the path you name is
# checked: never the current folder or the home folder.
# ============================================================================

version: "1.0"

# ----------------------------------------------------------------------------
# TENANT COLUMN — The column name used across all protected tables.
# If a table has this column, it gets auto-protected.
# Env override: DB_FIREWALL_TENANT_COLUMN
# ----------------------------------------------------------------------------
tenant_column: "tenant_id"

# ----------------------------------------------------------------------------
# FAIL MODE — What happens when no tenant context is set?
#   "closed" → the middleware refuses queries on protected tables
#              (PermissionError); the RLS layer returns 0 rows (RECOMMENDED)
#   "open"   → queries run unscoped by the middleware (development/testing only)
# Env override: DB_FIREWALL_FAIL_MODE
# ----------------------------------------------------------------------------
fail_mode: "closed"

# ----------------------------------------------------------------------------
# REWRITER — How the middleware injects the tenant predicate.
#   "ast"   → sqlglot parse + rewrite (DEFAULT). Scopes every table reference:
#             CTEs, UNION branches, joins, subqueries, UPDATE..FROM,
#             DELETE..USING, INSERT..SELECT/VALUES (stamps the tenant column).
#             Requires `pip install sqlglot`; raises ImportError if missing.
#   "regex" → legacy single-WHERE injector, no dependency. Refuses CTE/UNION/
#             multi-table shapes outright (fail closed) instead of scoping them.
# Env override: DB_FIREWALL_REWRITER=regex
# ----------------------------------------------------------------------------
rewriter: "ast"

# ----------------------------------------------------------------------------
# TENANT PLACEHOLDER — INSERT ... (tenant_id) VALUES (%s) binds the tenant
# column to a driver parameter the firewall cannot see. Refused by default;
# set true only when the database layer (RLS WITH CHECK) verifies it.
# ----------------------------------------------------------------------------
allow_tenant_placeholder: false

# ----------------------------------------------------------------------------
# TENANT HEADER — Django / FastAPI / Flask integrations ignore the X-Tenant-ID
# request header unless this is true. Any client can send it, so enable it
# only behind a gateway that authenticates the caller and overwrites any
# client-sent X-Tenant-ID.
# ?tenant_id= in the URL is never trusted.
# ----------------------------------------------------------------------------
trust_tenant_header: false

# ----------------------------------------------------------------------------
# PROTECTED OPERATIONS — Which SQL operations are filtered?
# ----------------------------------------------------------------------------
protect:
  select: true
  insert: true    # Prevents inserting rows for other tenants
  update: true    # Prevents updating rows across tenants
  delete: true    # Prevents deleting rows across tenants

# ----------------------------------------------------------------------------
# AUDIT — NOT read by the Python middleware (reserved). The migrations create
# _firewall_audit_log; on PostgreSQL, _firewall_set_tenant() writes a row per
# assignment. The middleware sets context directly and writes no audit row.
# Purge with: SELECT _firewall_purge_audit(90);
# ----------------------------------------------------------------------------
audit:
  enabled: true
  table_name: "_firewall_audit_log"
  retention_days: 90    # Auto-purge old audit records
  log_queries: false    # Set true to log actual SQL (careful: PII risk)

# ----------------------------------------------------------------------------
# TENANT RESOLUTION — fixed order, not configurable. protect(conn) without
# tenant_id= uses the first of:
#   1. the request's tenant (web integrations, tenant_scope(), set_tenant())
#   2. the TENANT_ID environment variable, when set
#   3. _firewall_tenant_map: the active row for the current DB user
#      (PostgreSQL, MySQL, SQL Server)
# Nothing found: no tenant, so fail_mode decides. Pass tenant_id= to be explicit.
# ----------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# EXCLUDED USERS — NOT read by the Python middleware yet (reserved): a listed
# role is still filtered by the middleware. To bypass it, use an unwrapped
# connection. EMPTY BY DEFAULT. On managed Postgres (Supabase, Neon, RDS) the application
# often connects as "postgres"; a built-in bypass list would disable the
# firewall for the app itself. Add roles deliberately, e.g. "_migrator".
# The DB-native layer has its own opt-in list: the _firewall_bypass_roles
# table created by the migrations (also empty by default).
# ----------------------------------------------------------------------------
excluded_users: []

# ----------------------------------------------------------------------------
# EXCLUDED TABLES — Tables that should NOT have tenant filtering.
# System/config tables that are shared across tenants.
# ----------------------------------------------------------------------------
excluded_tables:
  - "_firewall_*"     # Firewall's own tables (glob pattern)
  - "schema_migrations"
  - "alembic_version"
  - "knex_migrations"
  - "prisma_migrations"
  - "__diesel_schema_migrations"
  - "flyway_schema_history"
  - "app_config"
  - "feature_flags"

# ----------------------------------------------------------------------------
# DATABASE-SPECIFIC OVERRIDES — NOT read by the Python middleware (reserved).
# Each migration script sets up its own engine; the schema is fixed there.
# ----------------------------------------------------------------------------
engines:
  postgresql:
    use_rls: true               # Native Row-Level Security (preferred)
    schema: "public"
  mysql:
    use_views: true             # MySQL lacks native RLS; use view-based isolation
    schema: null                # Uses default schema
  sqlserver:
    use_rls: true               # SQL Server 2016+ supports RLS
    schema: "dbo"
  oracle:
    use_vpd: true               # Virtual Private Database
    schema: "APP_USER"
  sqlite:
    use_middleware: true         # SQLite has no RLS; enforce in middleware only
