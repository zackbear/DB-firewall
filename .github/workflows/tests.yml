name: tests

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }}, PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15      # a hung test fails the job instead of stalling it
    strategy:
      fail-fast: false
      matrix:
        # Each PostgreSQL version once, both Python versions twice.
        include:
          - { python: "3.11", postgres: "14" }
          - { python: "3.13", postgres: "15" }
          - { python: "3.11", postgres: "16" }
          - { python: "3.13", postgres: "17" }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: dbfw_test
          POSTGRES_HOST_AUTH_METHOD: trust     # tests log in as a password-less dbfw_app role
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DBFW_PG_DSN: "host=localhost port=5432 dbname=dbfw_test user=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest-cov flask starlette httpx sqlalchemy pymongo mongomock django
      # The Node CLI, so tests/test_verify_corpus_live.py can check that the
      # Python verify gives the same answers (DBFW_REQUIRE_PARITY: no skip).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci && npm run build
        working-directory: packages/cli
      - run: python -m pytest -q --cov=middleware --cov-report=term-missing --cov-fail-under=85
        env:
          DBFW_REQUIRE_PARITY: "1"

  live:
    # MySQL and SQL Server: migrations, middleware and scanner against real
    # servers on every pull request; on MySQL also the attack corpus
    # (tests/attack_corpus.py).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: DbfwCi_2026x
          MYSQL_DATABASE: dbfw
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pDbfwCi_2026x"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: DbfwCi_2026x
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DbfwCi_2026x -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 10s --health-retries 30
    env:
      DBFW_MYSQL_DSN: "mysql://root:DbfwCi_2026x@127.0.0.1:3306/dbfw"
      DBFW_MSSQL_DSN: "mssql://sa:DbfwCi_2026x@127.0.0.1:1433/dbfw"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt pymysql pymssql
      - name: Test data (MySQL, SQL Server)
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -pDbfwCi_2026x dbfw < tests/live_setup/mysql_before.sql
          MS=${{ job.services.mssql.id }}
          SQLCMD="/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P DbfwCi_2026x -b"
          docker exec $MS $SQLCMD -Q "IF DB_ID('dbfw') IS NULL CREATE DATABASE dbfw"
          docker cp tests/live_setup/sqlserver_before.sql $MS:/tmp/before.sql
          docker exec $MS $SQLCMD -d dbfw -i /tmp/before.sql
      - name: Live suites (a skipped test fails the job)
        run: |
          set -o pipefail
          python -m pytest -q -p no:cacheprovider -rs tests/test_mysql_live.py tests/test_sqlserver_live.py | tee live.txt
          ! grep -qi "skipped" live.txt

  typescript:
    # packages/ts (@db-firewall/pg), packages/cli (db-firewall, with the
    # attack corpus), packages/mcp and the agent starter against PostgreSQL
    # with the real migration.
    name: typescript (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "15", "16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: dbfw_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: packages/ts
    env:
      DBFW_PG_URL: "postgres://postgres@localhost:5432/dbfw_test"
      DBFW_REQUIRE_LIVE: "1"          # a missing URL fails instead of skipping the live suites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/ts/package-lock.json
            packages/cli/package-lock.json
            packages/mcp/package-lock.json
            examples/nextjs-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - name: CLI (db-firewall migrate / scan / verify)
        working-directory: packages/cli
        run: npm ci && npm test
      - name: MCP server (@db-firewall/mcp)
        working-directory: packages/mcp
        # npm ci installs the published @db-firewall/pg; the overlay tests against this repo's packages/ts
        run: npm ci && npm install --no-save ../ts && npm test
      - name: Agent starter (examples/nextjs-agent)
        working-directory: examples/nextjs-agent
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm ci && npm test && npx next build
