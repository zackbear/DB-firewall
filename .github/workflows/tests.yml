name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dbfw_test
          POSTGRES_HOST_AUTH_METHOD: trust     # tests log in as a password-less dbfw_app role
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DBFW_PG_DSN: "host=localhost port=5432 dbname=dbfw_test user=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest-cov flask starlette httpx sqlalchemy mongomock
      - run: python -m pytest -q --cov=middleware --cov-report=term-missing --cov-fail-under=85
